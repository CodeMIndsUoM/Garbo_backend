name: CI

on:
  pull_request:
    branches:
      - mergekth
      - main
  push:
    branches:
      - devops/**
      - mergekth

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Build and test
        run: mvn -B verify

      - name: Build Docker image
        run: docker build -t garbo-backend:ci .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: garbo-backend:ci
          format: table
          exit-code: "0"
          severity: CRITICAL,HIGH
