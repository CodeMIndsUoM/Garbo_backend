spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  main:
    allow-bean-definition-overriding: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: ${SPRING_JPA_SHOW_SQL:true}
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    out-of-order: true
    ignore-migration-patterns: "*:missing"
    validate-on-migrate: false

firebase:
  enabled: ${FIREBASE_ENABLED:false}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}

jwt:
  secret: ${JWT_SECRET:my_super_secret_key_my_super_secret_key}

server:
  port: ${SERVER_PORT:8081}

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never

sentry:
  dsn: ${SENTRY_DSN:}
  traces-sample-rate: 1.0

audit:
  file-change:
    log-path: ${AUDIT_FILE_CHANGE_LOG_PATH:logs/backend_file_audit.log}
    alert-log-path: ${AUDIT_FILE_CHANGE_ALERT_LOG_PATH:logs/backend_file_audit_alerts.log}
    max-bytes: ${AUDIT_FILE_CHANGE_MAX_BYTES:5242880}
    max-archives: ${AUDIT_FILE_CHANGE_MAX_ARCHIVES:10}
    retention-days: ${AUDIT_FILE_CHANGE_RETENTION_DAYS:30}
    hmac-secret: ${AUDIT_FILE_CHANGE_HMAC_SECRET:change-me-in-prod}
  integrity:
    enabled: ${AUDIT_INTEGRITY_ENABLED:true}
    scan-interval-ms: ${AUDIT_INTEGRITY_SCAN_INTERVAL_MS:300000}
    max-files: ${AUDIT_INTEGRITY_MAX_FILES:1000}
    monitored-paths: ${AUDIT_INTEGRITY_MONITORED_PATHS:pom.xml,Dockerfile,src/main/resources/application.yml,src/main/resources/application-local.yml,src/main/resources/application-prod.yml,scripts}
