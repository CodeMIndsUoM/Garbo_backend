spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  main:
    allow-bean-definition-overriding: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: ${SPRING_JPA_SHOW_SQL:true}
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:false}

firebase:
  enabled: ${FIREBASE_ENABLED:false}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}

server:
  port: ${SERVER_PORT:8081}

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}

# Bump latest-version when publishing a new mobile release (match pubspec.yaml version).
garbo:
  app:
    android:
      latest-version: ${GARBO_APP_ANDROID_VERSION:1.0.0}
      store-url: ${GARBO_APP_ANDROID_STORE_URL:https://play.google.com/store/apps/details?id=com.garbo}
      release-notes: ${GARBO_APP_ANDROID_RELEASE_NOTES:}
    ios:
      latest-version: ${GARBO_APP_IOS_VERSION:1.0.0}
      store-url: ${GARBO_APP_IOS_STORE_URL:}
      release-notes: ${GARBO_APP_IOS_RELEASE_NOTES:}
